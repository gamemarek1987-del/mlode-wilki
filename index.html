<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Młode Wilki – Zakopane</title>
<link rel="icon" href="logo.webp">
<style>
  :root { --orange:#ff7a1a; --ink:#10160f; --paper:#f3efe2; --moss:#27412a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#10160f; color:var(--paper);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  #top { position:absolute; top:8px; left:8px; right:8px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #roster { display:flex; gap:5px; padding:5px 7px; background:rgba(16,22,15,.55); border-radius:999px; backdrop-filter:blur(4px); }
  #roster img { width:30px; height:30px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#3a4a3a;
    filter:grayscale(1) brightness(.5); border:2px solid transparent; transition:filter .4s, transform .4s; }
  #roster img.on { filter:none; }
  #roster img.me { filter:none; border-color:var(--orange); }
  #roster img.pop { transform:scale(1.35); }
  #status { display:flex; gap:8px; align-items:center; font-weight:800; font-size:14px; }
  #status span { background:rgba(16,22,15,.55); padding:5px 11px; border-radius:999px; backdrop-filter:blur(4px); }
  #clock.low { color:#ffb199; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #toast { position:absolute; left:50%; top:104px; transform:translate(-50%,-10px); opacity:0; transition:all .3s;
    background:var(--paper); color:var(--ink); font-weight:800; font-size:15px; padding:8px 14px 8px 8px; border-radius:999px;
    display:flex; align-items:center; gap:8px; max-width:92vw; box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #toast img { width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#3a4a3a; flex:none; }
  #toast small { display:block; font-weight:600; opacity:.7; font-size:12px; }

  #howl { position:absolute; right:16px; bottom:22px; width:86px; height:86px; border-radius:50%; border:0; pointer-events:auto;
    background:var(--orange); color:#1b0e02; font:900 13px/1.1 inherit; box-shadow:0 6px 0 #b34f06, 0 10px 24px rgba(0,0,0,.4);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  #howl b { font-size:28px; line-height:1; }
  #howl:active { transform:translateY(4px); box-shadow:0 2px 0 #b34f06; }
  #howl[disabled] { filter:grayscale(.8) brightness(.7); }
  #hint { position:absolute; left:16px; bottom:26px; font-size:12px; font-weight:700; opacity:.75;
    background:rgba(16,22,15,.5); padding:6px 10px; border-radius:999px; transition:opacity .6s; }

  .ptr { position:absolute; left:0; top:0; width:44px; height:44px; margin:-22px 0 0 -22px; display:none; }
  .ptr img, .ptr .ico { position:absolute; inset:5px; width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:50% 20%;
    background:var(--paper); border:2px solid var(--paper); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .ptr i { position:absolute; inset:0; }
  .ptr i::after { content:""; position:absolute; right:-9px; top:50%; margin-top:-7px; border:7px solid transparent; border-left:10px solid var(--paper); border-right:0; }
  .ptr em { position:absolute; left:50%; top:100%; transform:translateX(-50%); font:800 11px inherit; font-style:normal;
    background:rgba(16,22,15,.6); padding:1px 6px; border-radius:99px; white-space:nowrap; }

  #joy { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; display:none;
    background:rgba(243,239,226,.12); border:2px solid rgba(243,239,226,.35); }
  #joy div { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(243,239,226,.75); }

  /* Screens */
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; overflow-y:auto; touch-action:pan-y;
    padding:22px 16px 28px; background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,122,26,.22), transparent 60%),
      linear-gradient(#16241a, #0c120d); }
  .screen.hidden { display:none; }
  #menu { background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,122,26,.20), transparent 60%),
      linear-gradient(rgba(16,26,19,.80), rgba(10,15,11,.94) 55%); }
  #logo { width:min(46vw, 190px); height:auto; margin-top:-4px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  #levels { display:flex; gap:8px; margin-top:8px; }
  .lvl { padding:7px 14px 8px; border-radius:12px; font-weight:900; font-size:15px; letter-spacing:.04em; text-align:center;
    background:rgba(243,239,226,.08); color:rgba(243,239,226,.45); border:2px solid transparent; }
  .lvl small { display:block; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
  .lvl.on { background:rgba(255,122,26,.16); border-color:var(--orange); color:var(--paper); }
  .kicker { text-align:center; line-height:1.5; font-weight:800; letter-spacing:.28em; font-size:11px; color:var(--orange); text-transform:uppercase; }
  h1 { margin:6px 0 2px; font-size:clamp(40px, 13vw, 76px); line-height:.9; font-weight:900; letter-spacing:-.02em; text-align:center; }
  h1 span { color:var(--orange); }
  .sub { margin:8px 0 16px; text-align:center; font-size:14px; line-height:1.4; opacity:.8; max-width:34ch; }
  #grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:100%; max-width:520px; }
  .card { position:relative; border:0; padding:0; border-radius:14px; overflow:hidden; background:#22342a; color:var(--paper);
    aspect-ratio:3/5; font:inherit; outline:3px solid transparent; transition:outline-color .15s, transform .15s; }
  .card img { position:absolute; left:50%; top:6%; height:120%; transform:translateX(-50%); pointer-events:none; }
  .card span { position:absolute; left:0; right:0; bottom:0; padding:14px 4px 6px; font-weight:800; font-size:12px; text-align:center;
    background:linear-gradient(transparent, rgba(8,12,8,.92) 55%); }
  .card span small { display:block; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--orange); }
  .card.sel { outline-color:var(--orange); transform:translateY(-3px); }
  .btn { margin-top:18px; border:0; border-radius:999px; padding:15px 34px; font:900 17px inherit; background:var(--orange); color:#1b0e02;
    box-shadow:0 5px 0 #b34f06; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b34f06; }
  .btn[disabled] { filter:grayscale(1) brightness(.6); }
  #end { justify-content:center; background:rgba(8,12,8,.82); backdrop-filter:blur(5px); }
  #end h2 { font-size:clamp(30px, 9vw, 54px); margin:6px 0; text-align:center; line-height:1; font-weight:900; }
  #end p { margin:6px 0 0; text-align:center; opacity:.85; max-width:30ch; line-height:1.4; }
  #endFaces { display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  #endFaces img { width:42px; height:42px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#3a4a3a; }
  #endFaces img.off { filter:grayscale(1) brightness(.45); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="top">
    <div id="roster"></div>
    <div id="status"><span id="count">Wataha 1/8</span><span id="clock">5:00</span></div>
  </div>
  <div id="toast"></div>
  <div id="ptrs"></div>
  <div id="joy"><div></div></div>
  <div id="hint">Przeciągnij palcem, żeby iść</div>
  <button id="howl"><b>🐺</b>WYJ!</button>
</div>

<div class="screen" id="menu">
  <img id="logo" src="logo.webp" alt="Młode Wilki">
  <div id="levels">
    <div class="lvl on"><small>Poziom 1</small>ZAKOPANE</div>
    <div class="lvl"><small>Poziom 2 · wkrótce</small>BIESZCZADY 🔒</div>
  </div>
  <p class="sub">Wataha rozeszła się po lesie pod Tatrami. Wybierz swojego Wilka, znajdź pozostałych siedmiu i doprowadź wszystkich do watry przy bacówce, zanim zapadnie noc.</p>
  <div id="grid"></div>
  <button class="btn" id="start" disabled>Wybierz Wilka</button>
</div>

<div class="screen hidden" id="end">
  <div class="kicker" id="endKick"></div>
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <div id="endFaces"></div>
  <button class="btn" id="again">Jeszcze raz</button>
</div>

<script type="module">
import * as THREE from './three.min.js';

/* ====== EKIPA — tu wpisuje się ksywki i teksty ====== */
const WOLVES = [
  { name: 'Piotras', nick: 'Laluś', line: 'Chwila, tylko poprawię fryzurę.' },
  { name: 'Robson', nick: 'Łasuch', line: 'Jest coś do jedzenia przy tej watrze?' },
  { name: 'Emil', nick: 'Drwal', line: 'Drewno na watrę? Zostaw to mnie.' },
  { name: 'Artek', nick: 'Ważniak', line: 'Mówiłem, że trzeba było iść za mną.' },
  { name: 'Damian', nick: 'Śpioch', line: 'Już? Dopiero się położyłem pod smrekiem.' },
  { name: 'Paweł', nick: 'Poeta', line: 'Szumią smreki, wataha czeka… idę.' },
  { name: 'Wojtas', nick: 'Pracuś', line: 'Nie stój tak, robota czeka. Kto rozbija namioty?' },
  { name: 'Maras', nick: 'Zgrywus', line: 'Haha, a ja tu stoję od godziny i patrzę, jak błądzisz!' },
];
const GAME_TIME = 300;       // sekundy do zmroku
const WORLD_R = 108;         // promień lasu
const LAKE = { x: 46, z: -34, r: 17 };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- renderer / scene ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const SKY_DAY = new THREE.Color('#a9d8ee'), SKY_DUSK = new THREE.Color('#f0a35c'), SKY_NIGHT = new THREE.Color('#0a1024');
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(SKY_DAY.clone(), 28, 95);
const camera = new THREE.PerspectiveCamera(52, 1, 0.5, 600);
const hemi = new THREE.HemisphereLight('#eaf6ff', '#4b6a3a', 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3d6', 1.5); sun.position.set(-40, 70, 30); scene.add(sun);

const uP = { value: new THREE.Vector3() }, uScr = { value: new THREE.Vector3() };
/* Makes trees between the camera and the player see-through (dithered). */
function seeThrough(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uP = uP; sh.uniforms.uScr = uScr;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vW;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 wpS = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wpS = instanceMatrix * wpS;
        #endif
        vW = (modelMatrix * wpS).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vW;\nuniform vec3 uP;\nuniform vec3 uScr;')
      .replace('void main() {', `void main() {
        float dzS = vW.z - uP.z;
        if (dzS > 0.5) {
          float dS = distance(gl_FragCoord.xy, uScr.xy);
          if (dS < uScr.z * 0.62) discard;
          if (dS < uScr.z || dzS > 7.5) {
            if (mod(floor(gl_FragCoord.x * 0.5) + floor(gl_FragCoord.y * 0.5), 2.0) < 1.0) discard;
          }
        }`);
  };
  return mat;
}

/* ---------- ground ---------- */
{
  const g = new THREE.PlaneGeometry(520, 520, 90, 90); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  const c1 = new THREE.Color('#4f7d3a'), c2 = new THREE.Color('#3b6630'), c3 = new THREE.Color('#6d8f45'), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const n = Math.sin(x * 0.07) * Math.cos(z * 0.09) + Math.sin((x + z) * 0.031) * 0.8 + Math.sin(x * 0.23 + z * 0.17) * 0.35;
    c.copy(c1).lerp(n > 0 ? c3 : c2, clamp(Math.abs(n) * 0.7, 0, 1));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
  // clearing
  const cl = new THREE.Mesh(new THREE.CircleGeometry(14.5, 40), new THREE.MeshLambertMaterial({ color: '#8a7a52' }));
  cl.rotation.x = -Math.PI / 2; cl.position.y = 0.02; scene.add(cl);
  const cl2 = new THREE.Mesh(new THREE.CircleGeometry(4.2, 32), new THREE.MeshLambertMaterial({ color: '#6b5a3c' }));
  cl2.rotation.x = -Math.PI / 2; cl2.position.y = 0.03; scene.add(cl2);
  // lake
  const sand = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r + 2.2, 48), new THREE.MeshLambertMaterial({ color: '#cdbd8a' }));
  sand.rotation.x = -Math.PI / 2; sand.position.set(LAKE.x, 0.02, LAKE.z); scene.add(sand);
  const water = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r, 48), new THREE.MeshLambertMaterial({ color: '#3f8fc4', emissive: '#12384f' }));
  water.rotation.x = -Math.PI / 2; water.position.set(LAKE.x, 0.05, LAKE.z); scene.add(water);
}

/* ---------- trees, rocks ---------- */
const obstacles = [];           // {x,z,r}
const grid = new Map(), CELL = 8;
const key = (cx, cz) => cx * 4096 + cz;
function addObstacle(x, z, r) {
  const o = { x, z, r }; obstacles.push(o);
  const k = key(Math.floor(x / CELL), Math.floor(z / CELL));
  (grid.get(k) || grid.set(k, []).get(k)).push(o);
}
function collide(p, rad) {
  const cx = Math.floor(p.x / CELL), cz = Math.floor(p.z / CELL);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = grid.get(key(cx + i, cz + j)); if (!list) continue;
    for (const o of list) {
      const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + rad;
      if (d < m && d > 1e-4) { p.x = o.x + dx / d * m; p.z = o.z + dz / d * m; }
    }
  }
  // lake
  let dx = p.x - LAKE.x, dz = p.z - LAKE.z, d = Math.hypot(dx, dz);
  if (d < LAKE.r + rad) { p.x = LAKE.x + dx / d * (LAKE.r + rad); p.z = LAKE.z + dz / d * (LAKE.r + rad); }
  // world edge
  d = Math.hypot(p.x, p.z);
  if (d > WORLD_R) { p.x *= WORLD_R / d; p.z *= WORLD_R / d; }
  // campfire stones
  if (d < 1.9 + rad * 0.5) { const m = 1.9 + rad * 0.5; p.x = (p.x || 0.01) / (d || 0.01) * m; p.z = p.z / (d || 0.01) * m; }
}
{
  const R = rng(20261109);
  const spots = [];
  for (let tries = 0; spots.length < 1050 && tries < 9000; tries++) {
    const a = R() * Math.PI * 2, rr = Math.sqrt(R()) * 150, x = Math.cos(a) * rr, z = Math.sin(a) * rr;
    if (rr < 19) continue;
    if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 4) continue;
    let ok = true;
    const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
    for (let i = -1; i <= 1 && ok; i++) for (let j = -1; j <= 1 && ok; j++) {
      const l = grid.get(key(cx + i, cz + j)); if (l) for (const o of l) if (Math.hypot(o.x - x, o.z - z) < 3.4) { ok = false; break; }
    }
    if (!ok) continue;
    const s = 0.8 + R() * 0.9;
    spots.push({ x, z, s, rot: R() * 6.28, tint: R() });
    addObstacle(x, z, 0.55 * s);
  }
  const trunkG = new THREE.CylinderGeometry(0.28, 0.42, 2.6, 6); trunkG.translate(0, 1.3, 0);
  const coneG = (r, h, y) => { const g = new THREE.ConeGeometry(r, h, 7); g.translate(0, y, 0); return g; };
  const parts = [
    [trunkG, new THREE.MeshLambertMaterial({ color: '#6b4a2e', flatShading: true }), false],
    [coneG(2.3, 3.4, 3.6), new THREE.MeshLambertMaterial({ color: '#ffffff', flatShading: true }), true],
    [coneG(1.8, 3.0, 5.4), new THREE.MeshLambertMaterial({ color: '#ffffff', flatShading: true }), true],
    [coneG(1.2, 2.6, 7.1), new THREE.MeshLambertMaterial({ color: '#ffffff', flatShading: true }), true],
  ];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const ca = new THREE.Color('#2f6b3a'), cb = new THREE.Color('#4f8a3c'), cc = new THREE.Color('#1f5140'), col = new THREE.Color();
  for (const [g, mat, tinted] of parts) {
    const im = new THREE.InstancedMesh(g, seeThrough(mat), spots.length);
    spots.forEach((s, i) => {
      q.setFromAxisAngle(up, s.rot); v.set(s.x, 0, s.z); sc.set(s.s, s.s * (0.9 + s.tint * 0.3), s.s);
      im.setMatrixAt(i, m4.compose(v, q, sc));
      if (tinted) { col.copy(ca).lerp(s.tint > 0.5 ? cb : cc, Math.abs(s.tint - 0.5) * 1.6); im.setColorAt(i, col); }
    });
    im.frustumCulled = false; scene.add(im);
  }
  // rocks
  const rocks = [];
  for (let i = 0; i < 90; i++) {
    const a = R() * 6.28, rr = 18 + R() * 110, x = Math.cos(a) * rr, z = Math.sin(a) * rr;
    if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 2) continue;
    rocks.push({ x, z, s: 0.5 + R() * 0.9, rot: R() * 6.28 });
  }
  const rim = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: '#8d9088', flatShading: true }), rocks.length);
  rocks.forEach((r, i) => { q.setFromAxisAngle(up, r.rot); v.set(r.x, r.s * 0.25, r.z); sc.set(r.s, r.s * 0.7, r.s); rim.setMatrixAt(i, m4.compose(v, q, sc)); addObstacle(r.x, r.z, r.s * 0.8); });
  rim.frustumCulled = false; scene.add(rim);
}

/* ---------- campfire & camp ---------- */
const fireLight = new THREE.PointLight('#ff8a2b', 0, 34, 1.6); fireLight.position.set(0, 2.2, 0); scene.add(fireLight);
const flames = [];
let signMat = null;
/* Tatry: ring of peaks around the valley */
const peakMat = new THREE.MeshLambertMaterial({ color: '#7f8ea3', flatShading: true, fog: false });
const snowMat = new THREE.MeshLambertMaterial({ color: '#f4f7fb', flatShading: true, fog: false });
{
  const R = rng(1895);
  for (let i = 0; i < 30; i++) {
    const a = i / 30 * 6.283 + R() * 0.12, north = Math.max(0, -Math.sin(a));
    const d = 235 + R() * 70, h = 55 + R() * 45 + north * 75, r = h * (0.62 + R() * 0.3);
    const pk = new THREE.Mesh(new THREE.ConeGeometry(r, h, 5 + (i % 3)), peakMat); pk.position.set(Math.cos(a) * d, h / 2 - 6, Math.sin(a) * d); pk.rotation.y = R() * 6; scene.add(pk);
    const sn = new THREE.Mesh(new THREE.ConeGeometry(r * 0.36, h * 0.36, 5 + (i % 3)), snowMat); sn.position.set(pk.position.x, h * 0.82 - 5.6, pk.position.z); sn.rotation.y = pk.rotation.y; scene.add(sn);
  }
}
/* owce */
const sheep = [];
{
  const wool = new THREE.MeshLambertMaterial({ color: '#f1ede2', flatShading: true }), dark = new THREE.MeshLambertMaterial({ color: '#2b2622', flatShading: true });
  const bodyG = new THREE.IcosahedronGeometry(0.55, 1); bodyG.scale(1.35, 1, 1);
  const headG = new THREE.BoxGeometry(0.36, 0.36, 0.34), legG = new THREE.CylinderGeometry(0.06, 0.06, 0.5, 5);
  const R = rng(77);
  for (let i = 0; i < 14; i++) {
    const g = new THREE.Group(), b = new THREE.Mesh(bodyG, wool); b.position.y = 0.85;
    const hd = new THREE.Mesh(headG, dark); hd.position.set(0.82, 1.0, 0); g.add(b, hd);
    [[-0.4, -0.2], [-0.4, 0.2], [0.4, -0.2], [0.4, 0.2]].forEach(([x, z]) => { const l = new THREE.Mesh(legG, dark); l.position.set(x, 0.25, z); g.add(l); });
    const a = R() * 6.283, rr = i < 4 ? 15 + R() * 6 : 24 + R() * 70; g.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);

}
{
  const stoneM = new THREE.MeshLambertMaterial({ color: '#77796f', flatShading: true });
  for (let i = 0; i < 9; i++) { const a = i / 9 * 6.28; const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), stoneM); s.position.set(Math.cos(a) * 1.5, 0.2, Math.sin(a) * 1.5); s.rotation.set(a, a * 2, 0); scene.add(s); }
  const logM = new THREE.MeshLambertMaterial({ color: '#4a3220', flatShading: true });
  for (let i = 0; i < 4; i++) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 2, 6), logM); l.rotation.set(Math.PI / 2 - 0.5, i * Math.PI / 2 + 0.4, 0, 'YXZ'); l.position.y = 0.5; scene.add(l); }
  [['#ff5a1f', 0.75, 2.0], ['#ff9d2e', 0.52, 1.5], ['#ffe08a', 0.3, 1.0]].forEach(([c, r, h], i) => {
    const f = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), new THREE.MeshBasicMaterial({ color: c, fog: false }));
    f.position.y = 0.4 + h / 2; f.userData = { h, i }; scene.add(f); flames.push(f);
  });
  // tents
  const tentM = [new THREE.MeshLambertMaterial({ color: '#e0681c', flatShading: true }), new THREE.MeshLambertMaterial({ color: '#2f4f6f', flatShading: true })];
  [[8.0, -6.5, 0.5, 0], [10.6, -0.8, 1.1, 1]].forEach(([x, z, r, m]) => {
    const t = new THREE.Mesh(new THREE.ConeGeometry(2.2, 2.5, 4), tentM[m]);
    t.rotation.y = r; t.position.set(x, 1.25, z); scene.add(t); addObstacle(x, z, 1.9);
  });
  // bacówka (góralska chata)
  {
    const wood = new THREE.MeshLambertMaterial({ color: '#7a5230', flatShading: true }), roofM = new THREE.MeshLambertMaterial({ color: '#3a2a20', flatShading: true });
    const hut = new THREE.Group();
    const walls = new THREE.Mesh(new THREE.BoxGeometry(5.4, 2.4, 4), wood); walls.position.y = 1.2;
    const rg = new THREE.ConeGeometry(4.3, 3.8, 4); rg.rotateY(Math.PI / 4);
    const roof = new THREE.Mesh(rg, roofM); roof.scale.set(1.05, 1, 0.82); roof.position.y = 4.25;
    const door = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 0.1), roofM); door.position.set(-0.9, 0.9, 2.03);
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.1), new THREE.MeshBasicMaterial({ color: '#ffd27a' })); win.position.set(1.2, 1.4, 2.03);
    hut.add(walls, roof, door, win); hut.position.set(-9.2, 0, -8.2); hut.rotation.y = 0.35; scene.add(hut); addObstacle(-9.2, -8.2, 3.3);
  }
  // sign with the pack's logo
  {
    const postM = new THREE.MeshLambertMaterial({ color: '#5a3d26', flatShading: true });
    [-1.5, 1.5].forEach(x => { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 3.9, 6), postM); p.position.set(x + 0.6, 1.95, -9.4); scene.add(p); });

}

/* ---------- characters (billboards from the avatar images) ---------- */
const loader = new THREE.TextureLoader();
const CHAR_H = 2.7, TILT = -0.26;
const shadowG = new THREE.CircleGeometry(0.8, 20); shadowG.rotateX(-Math.PI / 2);
const shadowM = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false });
function makeLabel(text) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 80; const x = cv.getContext('2d');
  x.font = '800 40px system-ui, sans-serif'; const w = Math.min(300, x.measureText(text).width + 44);
  x.fillStyle = 'rgba(16,22,15,.78)'; x.beginPath(); x.roundRect(160 - w / 2, 10, w, 60, 30); x.fill();
  x.fillStyle = '#f3efe2'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 160, 42, 270);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, fog: false })); s.scale.set(2.4, 0.6, 1); s.renderOrder = 5;

}
const chars = WOLVES.map((w, i) => {
  const group = new THREE.Group();
  const geo = new THREE.PlaneGeometry(1, 1); geo.translate(0, 0.5, 0);
  const mat = new THREE.MeshBasicMaterial({ alphaTest: 0.5, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat); mesh.scale.set(CHAR_H * 0.45, CHAR_H, 1); mesh.rotation.x = TILT;
  loader.load(`w${i + 1}.webp`, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; mat.map = t; mat.needsUpdate = true; mesh.scale.x = CHAR_H * t.image.width / t.image.height; });
  const sh = new THREE.Mesh(shadowG, shadowM); sh.position.y = 0.04;
  const label = makeLabel(w.name); label.position.set(0, CHAR_H + 0.5, -0.5);
  group.add(sh, mesh, label); group.visible = false; scene.add(group);

});

/* ---------- UI: menu ---------- */
let me = -1;
const grid$ = $('grid');
WOLVES.forEach((w, i) => {
  const b = document.createElement('button'); b.className = 'card';
  b.innerHTML = `<img src="w${i + 1}.webp" alt=""><span>${w.name}<small>${w.nick || '&nbsp;'}</small></span>`;
  b.onclick = () => { me = i; [...grid$.children].forEach((c, k) => c.classList.toggle('sel', k === i)); $('start').disabled = false; $('start').textContent = `Gram jako ${w.name} →`; };
  grid$.append(b);
  const r = document.createElement('img'); r.src = `f${i + 1}.webp`; r.alt = ''; $('roster').append(r);
  const p = document.createElement('div'); p.className = 'ptr'; p.innerHTML = `<i></i><img src="f${i + 1}.webp" alt=""><em></em>`; $('ptrs').append(p);
});
const firePtr = document.createElement('div'); firePtr.className = 'ptr'; firePtr.innerHTML = '<i></i><div class="ico">🔥</div><em></em>'; $('ptrs').append(firePtr);
const ptrEls = [...$('ptrs').children];

/* ---------- audio ---------- */
let actx = null;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } return actx; }

  [1, 1.5].forEach((mul, k) => {
    const o = a.createOscillator(), g = a.createGain(); o.type = k ? 'sine' : 'triangle';
    o.frequency.setValueAtTime(260 * mul, t); o.frequency.exponentialRampToValueAtTime(520 * mul, t + 0.45); o.frequency.setValueAtTime(520 * mul, t + 1.1); o.frequency.exponentialRampToValueAtTime(330 * mul, t + 1.9);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(k ? 0.05 : 0.16, t + 0.3); g.gain.setValueAtTime(k ? 0.05 : 0.16, t + 1.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);

}

  (up ? [523, 659, 784] : [392, 330, 262]).forEach((f, k) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + k * 0.09); g.gain.exponentialRampToValueAtTime(0.14, t + k * 0.09 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + 0.25); o.connect(g).connect(a.destination); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.3); });
}

/* ---------- game state ---------- */
let state = 'menu', timeLeft = GAME_TIME, pack = [], howlT = 0, howlCd = 0, toastT = 0, moved = false;
const input = { x: 0, z: 0 }, keys = {};
function toast(html, dur = 3.2) { const t = $('toast'); t.innerHTML = html; t.classList.add('show'); toastT = dur; }
function updateHud() {
  const n = chars.filter(c => c.found).length;
  $('count').textContent = n === chars.length ? 'Komplet! Wracaj do watry 🔥' : `Wataha ${n}/${chars.length}`;
  [...$('roster').children].forEach((el, i) => { el.classList.toggle('on', chars[i].found); el.classList.toggle('me', i === me); });
}
function startGame() {
  const R = Math.random, off = R() * 6.28, others = chars.filter(c => c.i !== me);

  const p = chars[me]; p.found = true; p.pos.set(0, 0, 4.5); pack = [p];
  others.forEach((c, k) => {
    for (let t = 0; t < 30; t++) {
      const a = off + k / others.length * 6.28 + (R() - 0.5) * 0.5, r = 38 + R() * 55;
      c.pos.set(Math.cos(a) * r, 0, Math.sin(a) * r);

    }
    collide(c.pos, 0.6); c.home.copy(c.pos); c.target.copy(c.pos);
  });
  timeLeft = GAME_TIME; howlT = 0; howlCd = 0; moved = false; state = 'play';
  $('menu').classList.add('hidden'); $('end').classList.add('hidden'); $('hud').style.display = 'block'; $('hint').style.opacity = .75; $('howl').disabled = false;
  updateHud(); audio();
  toast(`<img src="f${me + 1}.webp" alt=""><div>${p.name}, znajdź watahę!<small>Zgubiłeś się? Wciśnij WYJ!</small></div>`, 4.5);
}
function endGame(win) {
  state = 'end'; input.x = input.z = 0; joyEnd();
  const n = chars.filter(c => c.found).length, used = GAME_TIME - timeLeft;
  $('endKick').textContent = win ? 'Zakopane zaliczone · wataha w komplecie' : 'Zakopane · zapadła noc';
  $('endTitle').innerHTML = win ? 'AUUUUU! 🐺' : 'Las wygrał…';
  $('endText').textContent = win
    ? `Wszystkich ośmiu przy watrze w ${Math.floor(used / 60)}:${String(Math.floor(used % 60)).padStart(2, '0')}. ${chars[me].name} stawia kiełbaski.`
    : `Przy watrze ${n} z ${chars.length}. Reszta nocuje pod smrekiem z owcami.`;
  $('endFaces').innerHTML = chars.map(c => `<img src="f${c.i + 1}.webp" alt="" class="${win || c.found ? '' : 'off'}">`).join('');
  $('end').classList.remove('hidden'); $('hud').style.display = 'none';

}
$('start').onclick = () => { if (me >= 0) startGame(); };
$('again').onclick = () => { $('end').classList.add('hidden'); $('menu').classList.remove('hidden'); state = 'menu'; chars.forEach(c => c.group.visible = false); };
$('howl').onclick = () => {
  if (state !== 'play' || howlCd > 0) return;
  howlT = 6; howlCd = 9; $('howl').disabled = true; howlSound();
  const left = chars.filter(c => !c.found).length;
  toast(left ? `<img src="f${me + 1}.webp" alt=""><div>Auuuuu!<small>Wataha odpowiada, patrz na strzałki</small></div>` : `<img src="f${me + 1}.webp" alt=""><div>Auuuuu!<small>Wszyscy są, wracaj do ogniska</small></div>`, 2.6);
};

/* ---------- controls ---------- */
const joy = $('joy'), knob = joy.firstElementChild; let joyId = null, jx = 0, jy = 0;
function joyEnd() { joyId = null; joy.style.display = 'none'; input.x = input.z = 0; }
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || joyId !== null) return;
  joyId = e.pointerId; jx = e.clientX; jy = e.clientY; joy.style.left = jx + 'px'; joy.style.top = jy + 'px'; joy.style.display = 'block'; knob.style.transform = '';
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  let dx = e.clientX - jx, dy = e.clientY - jy; const d = Math.hypot(dx, dy), M = 48;
  if (d > M) { dx *= M / d; dy *= M / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`; input.x = dx / M; input.z = dy / M;
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => canvas.addEventListener(n, e => { if (e.pointerId === joyId) joyEnd(); }));
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space' && state === 'play') { e.preventDefault(); $('howl').click(); } });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('contextmenu', e => e.preventDefault());

/* ---------- loop ---------- */
const tmp = new THREE.Vector3(), v2 = new THREE.Vector2(), camPos = new THREE.Vector3(0, 8.6, 17.5), sky = new THREE.Color();
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 58 : 48; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function stepChar(c, vx, vz, dt) {
  const sp = Math.hypot(vx, vz);
  if (sp > 0.05) { c.pos.x += vx * dt; c.pos.z += vz * dt; collide(c.pos, 0.55); c.phase += sp * dt * 1.25; c.moving = Math.min(1, c.moving + dt * 8); }
  else c.moving = Math.max(0, c.moving - dt * 6);
  c.mesh.position.y = Math.abs(Math.sin(c.phase)) * 0.16 * c.moving;
  c.mesh.rotation.z = Math.sin(c.phase) * 0.085 * c.moving;
}
function pointer(el, wx, wz, show, text) {
  const p = chars[me].pos, dx = wx - p.x, dz = wz - p.z, d = Math.hypot(dx, dz);
  if (!show || d < 13) { el.style.display = 'none'; return; }
  const a = Math.atan2(dz, dx), rx = innerWidth * 0.5 - 34, ry = innerHeight * 0.5 - 150;
  const k = 1 / Math.max(Math.abs(Math.cos(a)) / rx, Math.abs(Math.sin(a)) / Math.max(ry, 80));
  el.style.display = 'block';
  el.style.transform = `translate(${innerWidth / 2 + Math.cos(a) * k}px, ${innerHeight / 2 + 20 + Math.sin(a) * k}px)`;
  el.firstElementChild.style.transform = `rotate(${a}rad)`;
  el.lastElementChild.textContent = text ?? `${Math.round(d)} m`;
}

let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  let night = 0, p = me >= 0 ? chars[me] : null;

  if (state === 'play') {
    // input
    let ix = input.x + ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
    let iz = input.z + ((keys.KeyS || keys.ArrowDown) ? 1 : 0) - ((keys.KeyW || keys.ArrowUp) ? 1 : 0);
    const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
    if (il > 0.2 && !moved) { moved = true; $('hint').style.opacity = 0; }
    const SPEED = 9.5;
    stepChar(p, ix * SPEED, iz * SPEED, dt);

    // pack follows in a chain
    for (let k = 1; k < pack.length; k++) {
      const c = pack[k], lead = pack[k - 1]; tmp.subVectors(lead.pos, c.pos); tmp.y = 0; const d = tmp.length();
      if (d > 30) { c.pos.copy(lead.pos).add(tmp.set(1.2, 0, 1.2)); stepChar(c, 0, 0, dt); continue; }
      if (d > 2.1) { const v = Math.min(SPEED * 1.15, (d - 1.9) * 5); stepChar(c, tmp.x / d * v, tmp.z / d * v, dt); } else stepChar(c, 0, 0, dt);
    }
    // lost wolves wander, join when you get close

      if (c.found) continue;
      c.wait -= dt; tmp.subVectors(c.target, c.pos); const d = Math.hypot(tmp.x, tmp.z);
      if (d < 0.3 || c.wait < -6) { if (c.wait < 0) { c.wait = 1 + Math.random() * 3; const a = Math.random() * 6.28, r = 1 + Math.random() * 4; c.target.set(c.home.x + Math.cos(a) * r, 0, c.home.z + Math.sin(a) * r); } stepChar(c, 0, 0, dt); }
      else if (c.wait <= 0) stepChar(c, tmp.x / d * 1.6, tmp.z / d * 1.6, dt); else stepChar(c, 0, 0, dt);
      if (Math.hypot(c.pos.x - p.pos.x, c.pos.z - p.pos.z) < 3.3) {
        c.found = true; pack.push(c); blip(true); updateHud();
        const el = $('roster').children[c.i]; el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 500);
        toast(`<img src="f${c.i + 1}.webp" alt=""><div>${c.name}${c.nick ? ` „${c.nick}”` : ''} dołącza do watahy!<small>„${c.line}”</small></div>`, 4);
      }
    }
    // clock
    timeLeft -= dt; howlT -= dt; howlCd -= dt;
    if (howlCd <= 0 && $('howl').disabled) $('howl').disabled = false;
    const s = Math.max(0, Math.ceil(timeLeft)); $('clock').textContent = `${s > 60 ? '☀️' : '🌙'} ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; $('clock').classList.toggle('low', s <= 60);
    const all = pack.length === chars.length, dFire = Math.hypot(p.pos.x, p.pos.z);
    if (all && dFire < 8) endGame(true); else if (timeLeft <= 0) endGame(false);
    // pointers
    chars.forEach((c, i) => pointer(ptrEls[i], c.pos.x, c.pos.z, !c.found && howlT > 0));
    pointer(firePtr, 0, 0, all || howlT > 0 || dFire > 60);
    if (toastT > 0 && (toastT -= dt) <= 0) $('toast').classList.remove('show');
  }

  // day -> dusk -> night
  const prog = state === 'menu' ? 0.15 : clamp(1 - timeLeft / GAME_TIME, 0, 1);
  if (prog < 0.6) sky.copy(SKY_DAY).lerp(SKY_DUSK, Math.pow(prog / 0.6, 2.2)); else sky.copy(SKY_DUSK).lerp(SKY_NIGHT, (prog - 0.6) / 0.4);
  night = clamp((prog - 0.45) / 0.55, 0, 1);
  scene.background.copy(sky); scene.fog.color.copy(sky); scene.fog.far = lerp(95, 62, night);
  hemi.intensity = lerp(1.15, 0.32, night); sun.intensity = lerp(1.5, 0.08, night); sun.color.setHSL(0.1, 0.8, lerp(0.9, 0.6, night));
  const flick = 0.85 + Math.sin(T * 11) * 0.08 + Math.sin(T * 23.7) * 0.07;
  fireLight.intensity = lerp(18, 130, night) * flick;
  flames.forEach(f => { const k = 0.85 + Math.sin(T * (9 + f.userData.i * 4) + f.userData.i) * 0.18; f.scale.set(1, k, 1); f.position.y = 0.4 + f.userData.h * k / 2; f.rotation.y = T * (1 + f.userData.i); });
  const base = lerp(1, 0.42, night);
  for (const c of chars) {
    const glow = night * Math.max(0, 1 - Math.hypot(c.pos.x, c.pos.z) / 16) * 0.75;
    c.mat.color.setRGB(Math.min(1, base * 0.97 + glow), Math.min(1, base + glow * 0.8), Math.min(1, base * lerp(1, 1.18, night) + glow * 0.5));
  }

  // camera
  if (p && state !== 'menu') { tmp.set(p.pos.x, 8.6, p.pos.z + 13); camPos.lerp(tmp, 1 - Math.pow(0.0015, dt)); camera.position.copy(camPos); camera.lookAt(camPos.x, 2.4, camPos.z - 16); camera.updateMatrixWorld(); uP.value.copy(p.pos);
    tmp.set(p.pos.x, 1.4, p.pos.z).project(camera); renderer.getDrawingBufferSize(v2); uScr.value.set((tmp.x * 0.5 + 0.5) * v2.x, (tmp.y * 0.5 + 0.5) * v2.y, v2.y * 0.21); }
  else { camera.position.set(Math.sin(T * 0.1) * 9, 7, 30 + Math.cos(T * 0.1) * 3); camera.lookAt(0, 9, -20); uP.value.set(0, 0, 9999); }
  // sheep graze and wander
  for (const s of sheep) {
    s.t -= dt; if (s.t <= 0) { s.go = !s.go; s.t = s.go ? 1.5 + Math.random() * 3 : 2 + Math.random() * 5; if (s.go) s.dir = Math.random() * 6.283; }
    if (s.go) { s.g.position.x += Math.cos(s.dir) * 1.3 * dt; s.g.position.z += Math.sin(s.dir) * 1.3 * dt; collide(s.g.position, 0.6); s.g.position.y = Math.abs(Math.sin(T * 9 + s.dir)) * 0.07; }
    let dr = -s.dir - s.g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); s.g.rotation.y += dr * Math.min(1, dt * 5);
  }
  if (signMat) signMat.color.setScalar(lerp(1, 0.55, night));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__game = { chars, get state() { return state; }, get pack() { return pack; }, setTime: v => { timeLeft = v; } };
requestAnimationFrame(frame);
</script>
