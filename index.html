<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Młode Wilki – Zakopane</title>
<link rel="icon" href="logo.webp">
<style>
  :root { --orange:#ff7a1a; --ink:#10160f; --paper:#f3efe2; --moss:#27412a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#10160f; color:var(--paper);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  #top { position:absolute; top:8px; left:8px; right:8px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #roster { display:flex; gap:5px; padding:5px 7px; background:rgba(16,22,15,.55); border-radius:999px; backdrop-filter:blur(4px); }
  #roster img { width:30px; height:30px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#3a4a3a;
    filter:grayscale(1) brightness(.5); border:2px solid transparent; transition:filter .4s, transform .4s; }
  #roster img.on { filter:none; }
  #roster img.me { filter:none; border-color:var(--orange); }
  #roster img.pop { transform:scale(1.35); }
  #status { display:flex; gap:8px; align-items:center; font-weight:800; font-size:14px; }
  #status span { background:rgba(16,22,15,.55); padding:5px 11px; border-radius:999px; backdrop-filter:blur(4px); }
  #clock.low { color:#ffb199; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #toast { position:absolute; left:50%; top:104px; transform:translate(-50%,-10px); opacity:0; transition:all .3s;
    background:var(--paper); color:var(--ink); font-weight:800; font-size:15px; padding:8px 14px 8px 8px; border-radius:999px;
    display:flex; align-items:center; gap:8px; max-width:92vw; box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #toast img { width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#3a4a3a; flex:none; }
  #toast small { display:block; font-weight:600; opacity:.7; font-size:12px; }

  #howl { position:absolute; right:16px; bottom:22px; width:86px; height:86px; border-radius:50%; border:0; pointer-events:auto;
    background:var(--orange); color:#1b0e02; font:900 13px/1.1 inherit; box-shadow:0 6px 0 #b34f06, 0 10px 24px rgba(0,0,0,.4);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  #music { position:absolute; right:22px; bottom:124px; width:46px; height:46px; border-radius:50%; border:0; pointer-events:auto; font-size:20px;
    background:rgba(16,22,15,.6); color:var(--paper); backdrop-filter:blur(4px); }
  #music.off { opacity:.45; text-decoration:line-through; }
  #howl b { font-size:28px; line-height:1; }
  #howl:active { transform:translateY(4px); box-shadow:0 2px 0 #b34f06; }
  #howl[disabled] { filter:grayscale(.8) brightness(.7); }
  #hint { position:absolute; left:16px; bottom:26px; font-size:12px; font-weight:700; opacity:.75;
    background:rgba(16,22,15,.5); padding:6px 10px; border-radius:999px; transition:opacity .6s; }

  .ptr { position:absolute; left:0; top:0; width:44px; height:44px; margin:-22px 0 0 -22px; display:none; }
  .ptr img, .ptr .ico { position:absolute; inset:5px; width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:50% 20%;
    background:var(--paper); border:2px solid var(--paper); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .ptr i { position:absolute; inset:0; }
  .ptr i::after { content:""; position:absolute; right:-9px; top:50%; margin-top:-7px; border:7px solid transparent; border-left:10px solid var(--paper); border-right:0; }
  .ptr em { position:absolute; left:50%; top:100%; transform:translateX(-50%); font:800 11px inherit; font-style:normal;
    background:rgba(16,22,15,.6); padding:1px 6px; border-radius:99px; white-space:nowrap; }

  #joy { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; display:none;
    background:rgba(243,239,226,.12); border:2px solid rgba(243,239,226,.35); }
  #joy div { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(243,239,226,.75); }

  /* Screens */
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; overflow-y:auto; touch-action:pan-y;
    padding:22px 16px 28px; background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,122,26,.22), transparent 60%),
      linear-gradient(#16241a, #0c120d); }
  .screen.hidden { display:none; }
  #menu { background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,122,26,.20), transparent 60%),
      linear-gradient(rgba(16,26,19,.80), rgba(10,15,11,.94) 55%); }
  #logo { width:min(46vw, 190px); height:auto; margin-top:-4px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  #levels { display:flex; gap:8px; margin-top:8px; }
  .lvl { padding:7px 14px 8px; border-radius:12px; font-weight:900; font-size:15px; letter-spacing:.04em; text-align:center;
    background:rgba(243,239,226,.08); color:rgba(243,239,226,.45); border:2px solid transparent; }
  .lvl small { display:block; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
  .lvl.on { background:rgba(255,122,26,.16); border-color:var(--orange); color:var(--paper); }
  #chaos { position:absolute; top:84px; left:50%; transform:translateX(-50%); width:150px; height:13px; border-radius:99px; background:rgba(16,22,15,.55); overflow:hidden; }
  #chaos i { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#ffb347,#e0401c); transition:width .4s; }
  #chaos b { position:absolute; inset:0; text-align:center; font-size:9px; line-height:13px; letter-spacing:.2em; color:#fff; }
  #tasks { position:absolute; left:8px; top:104px; margin:0; padding:7px 10px; list-style:none; font-size:11.5px; font-weight:700; line-height:1.55; background:rgba(16,22,15,.5); border-radius:12px; backdrop-filter:blur(4px); max-width:62vw; }
  #tasks li.ok { color:#9be28a; opacity:.8; }
  #toast { top:214px !important; }
  #quiz { position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center; padding:14px; pointer-events:none; }
  #quiz.hidden { display:none; }
  #levels { flex-wrap:wrap; justify-content:center; }
  button.lvl { font-family:inherit; cursor:pointer; }
  #haggle { position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center; padding:14px; pointer-events:none; }
  #haggle.hidden { display:none; }
  .hbox { pointer-events:auto; width:100%; max-width:380px; background:var(--paper); color:var(--ink); border-radius:20px; padding:14px 16px 16px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .hbox p { margin:6px 0 10px; font-weight:800; font-size:15px; min-height:38px; }
  .hbox small { display:block; margin:6px 0; opacity:.65; font-size:11px; }
  #hBar { position:relative; height:26px; border-radius:99px; background:#d8d2bf; overflow:hidden; }
  #hZone { position:absolute; top:0; bottom:0; background:#58b25a; }
  #hMark { position:absolute; top:-3px; bottom:-3px; width:6px; margin-left:-3px; background:var(--ink); border-radius:3px; }
  #hPrice { font-weight:900; font-size:16px; margin:4px 0 2px; }
  .hbox .btn { margin-top:8px; padding:11px 20px; font-size:15px; width:100%; }
  .btn.alt { background:#2f6f4f; color:#fff; box-shadow:0 5px 0 #1d4a34; }
  .btn.ghost { background:transparent; color:var(--ink); box-shadow:none; opacity:.6; padding:6px !important; }
  #perk { margin-top:14px; font-size:12.5px; font-weight:700; color:var(--orange); text-align:center; min-height:18px; max-width:34ch; }
  #badge { width:132px; height:132px; border-radius:50%; margin-bottom:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 35% 30%, #ffe08a, #d39a2e 60%, #8a5f14); color:#3a2606; border:5px solid #fff3c4; box-shadow:0 8px 30px rgba(0,0,0,.5); font-weight:900; font-size:13px; line-height:1.05; letter-spacing:.04em; }
  #badge b { font-size:38px; line-height:1; }
  #stats { margin-top:12px; width:100%; max-width:330px; font-size:13px; }
  #stats div { display:flex; justify-content:space-between; gap:12px; padding:5px 2px; border-bottom:1px solid rgba(243,239,226,.14); }
  #stats span { opacity:.75; }
  #end { justify-content:flex-start !important; padding-top:26px; }
  .kicker { text-align:center; line-height:1.5; font-weight:800; letter-spacing:.28em; font-size:11px; color:var(--orange); text-transform:uppercase; }
  h1 { margin:6px 0 2px; font-size:clamp(40px, 13vw, 76px); line-height:.9; font-weight:900; letter-spacing:-.02em; text-align:center; }
  h1 span { color:var(--orange); }
  .sub { margin:8px 0 16px; text-align:center; font-size:14px; line-height:1.4; opacity:.8; max-width:34ch; }
  #grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:100%; max-width:520px; }
  .card { position:relative; border:0; padding:0; border-radius:14px; overflow:hidden; background:#22342a; color:var(--paper);
    aspect-ratio:3/5; font:inherit; outline:3px solid transparent; transition:outline-color .15s, transform .15s; }
  .card img { position:absolute; left:50%; top:6%; height:120%; transform:translateX(-50%); pointer-events:none; }
  .card span { position:absolute; left:0; right:0; bottom:0; padding:14px 4px 6px; font-weight:800; font-size:12px; text-align:center;
    background:linear-gradient(transparent, rgba(8,12,8,.92) 55%); }
  .card span small { display:block; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--orange); }
  .card.sel { outline-color:var(--orange); transform:translateY(-3px); }
  .btn { margin-top:18px; border:0; border-radius:999px; padding:15px 34px; font:900 17px inherit; background:var(--orange); color:#1b0e02;
    box-shadow:0 5px 0 #b34f06; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b34f06; }
  .btn[disabled] { filter:grayscale(1) brightness(.6); }
  #end { justify-content:center; background:rgba(8,12,8,.82); backdrop-filter:blur(5px); }
  #end h2 { font-size:clamp(30px, 9vw, 54px); margin:6px 0; text-align:center; line-height:1; font-weight:900; }
  #end p { margin:6px 0 0; text-align:center; opacity:.85; max-width:30ch; line-height:1.4; }
  #endFaces { display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  #endFaces img { width:42px; height:42px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#3a4a3a; }
  #endFaces img.off { filter:grayscale(1) brightness(.45); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="top">
    <div id="roster"></div>
    <div id="status"><span id="count">💰 0</span><span id="clock">10:00</span><span id="inv" style="display:none"></span></div>
  </div>
  <div id="chaos"><i id="chaosFill"></i><b>CHAOS</b></div>
  <ul id="tasks"></ul>
  <div id="toast"></div>
  <div id="ptrs"></div>
  <div id="joy"><div></div></div>
  <div id="hint">Lewa strona: idziesz · prawa: kamera</div>
  <button id="howl"><b>🐺</b>WYJ!</button>
  <button id="music" aria-label="Muzyka">🎵</button>
</div>

<div class="screen" id="menu">
  <img id="logo" src="logo.webp" alt="Młode Wilki">
  <div id="levels"></div>
  <p class="sub" id="sub"></p>
  <div id="grid"></div>
  <div id="perk">Każdy Wilk ma swoją zdolność</div>
  <button class="btn" id="start" disabled>Wybierz Wilka</button>
</div>

<div id="haggle" class="hidden">
  <div class="hbox">
    <div class="kicker">Targowanie z bacą</div>
    <p id="hLine"></p>
    <div id="hBar"><span id="hZone"></span><i id="hMark"></i></div>
    <small>Wciśnij „Targuj!”, gdy znacznik jest w zielonym polu</small>
    <div id="hPrice"></div>
    <button class="btn" id="hTry">Targuj!</button>
    <button class="btn alt" id="hBuy">Kupuję</button>
    <button class="btn ghost" id="hExit">Wychodzę</button>
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="hbox">
    <div class="kicker">Rozdroże na szlaku</div>
    <p id="qText"></p>
    <div id="qOpts"></div>
  </div>
</div>

<div class="screen hidden" id="end">
  <div class="kicker" id="endKick"></div>
  <div id="badge"><b>👑</b><span>KRÓL<br>KRUPÓWEK</span></div>
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <div id="stats"></div>
  <div id="endFaces"></div>
  <button class="btn" id="next">Następny poziom →</button>
  <button class="btn ghost" id="again" style="color:var(--paper)">Menu</button>
</div>

<script type="module">
import * as THREE from './three.min.js';

/* ====== EKIPA ====== */
const WOLVES = [
  { name: 'Piotras', nick: 'Laluś', line: 'Chwila, tylko poprawię fryzurę.', v: 'v5', perk: 'Od razu widzi strzałki do wszystkich zgubionych rzeczy' },
  { name: 'Robson', nick: 'Łasuch', line: 'Jest prowiant? To idę!', v: 'v6', perk: 'Baca zaczyna targi od niższej ceny' },
  { name: 'Emil', nick: 'Drwal', line: 'Siekiera jest, można iść!', v: 'v8', perk: 'Nosi dwa bagaże naraz' },
  { name: 'Artek', nick: 'Ważniak', line: 'Mówiłem, że trzeba było iść za mną.', v: 'v3', perk: 'Chodzi szybciej od reszty' },
  { name: 'Damian', nick: 'Śpioch', line: 'Daleko jeszcze? Bo mi się już odechciało!', v: 'v10', perk: 'Wyspany: 90 sekund więcej do zmroku' },
  { name: 'Paweł', nick: 'Poeta', line: 'Szumią smreki, wataha czeka… idę.', v: 'v11', perk: 'Gadane ma: łatwiej się targuje' },
  { name: 'Wojtas', nick: 'Pracuś', line: 'Nie stój tak, robota czeka!', v: 'v13', perk: 'Trzyma porządek: chaos rośnie wolniej' },
  { name: 'Maras', nick: 'Zgrywus', line: 'Kto chrapie, ten śpi w busie!', v: 'v17', perk: 'Niedźwiedzie zauważają go dużo później' },
];
/* Voice recordings: key -> file. Empty until the team sends them; lines show as captions either way. */
const VOICE = Object.fromEntries(Array.from({ length: 17 }, (_, k) => ['v' + (k + 1), `v${k + 1}.mp3`]));
const VBUF = {};
const GRUMBLES = [[1, 'Kiedy jemy?', 'v7'], [4, 'Daleko jeszcze? Bo mi się już odechciało!', 'v10'], [5, 'Mówiłem wam, że to nie ta droga!', 'v12'], [7, 'Kto chrapie, ten śpi w busie!', 'v17'], [0, 'Wieje. Fryzura mi się psuje.', ''], [6, 'Ktoś to w ogóle zaplanował?', ''], [2, 'Tu by się przydała porządna ścieżka.', ''], [3, 'Za mną, znam te tereny.', '']];
const GAME_TIME = 600, WORLD_R = 175, BUS = { x: 4.5, z: 34 }, KRUP = 0.4, LAKE = { x: 46, z: -34, r: 17 };
const TRAILS = [0.4, 1.75, 2.95, 4.15, 5.0];
const SHELTER = { x: 25.5, z: -34 };
const VIEWS = [[-80, 62], [88, 86], [30, 124], [-122, -32], [110, -72]], VIEW_NAMES = ['Widok na Giewont', 'Taras pod skałami', 'Polana z owcami', 'Zachodnia grań', 'Nad doliną'];
const JUNC = [[-103, 20], [-57, 11], [8, -10]];
const QUIZ = [
  { q: 'Tabliczka się urwała. Jakim kolorem oznaczony jest szlak z Palenicy do Morskiego Oka?', o: ['Czerwonym', 'Zielonym', 'Żółtym'], a: 0 },
  { q: 'Artek mówi „w lewo”, Maras „znam skrót w prawo”, a mapa pokazuje prosto. Komu ufasz?', o: ['Artkowi', 'Marasowi', 'Mapie'], a: 2 },
  { q: 'Kompas pokazuje północ na wprost. Morskie Oko leży na południowym wschodzie. Którędy?', o: ['↖ w lewo do przodu', '↘ w prawo do tyłu', '↗ w prawo do przodu'], a: 1 },
];
const LEVELS = {
  1: { name: 'Zakopane', title: 'Operacja: Gdzie są kluczyki?', time: 600, badge: ['👑', 'KRÓL<br>KRUPÓWEK'], home: [4.5, 34, '🚐'], sub: 'Zbierz watahę, kup prowiant u bacy, zapakuj busa i znajdź kluczyki, zanim zapadnie noc.', win: 'Kluczyki są, bus zapakowany, prowiant kupiony. Wyprawa może ruszać dalej.' },
  2: { name: 'Gubałówka', title: 'Wielka awaria nawigacji', time: 540, badge: ['🧭', 'MISTRZ<br>SKRÓTÓW'], home: [0, 36, '🚠'], sub: 'Znajdź mapę, zalicz 5 punktów widokowych i złap czapkę porwaną przez wiatr. Ktoś twierdzi, że zna skrót. Oczywiście nie zna.', win: 'Pięć widoków, czapka uratowana i nikt nie został na górze. Skrótów nie polecamy.' },
  3: { name: 'Morskie Oko', title: 'Misja: Zaginiony termos', time: 540, badge: ['🥾', 'OSTATNI<br>NA SZLAKU'], home: [25.5, -34, '🏠'], sub: 'Przeprowadź całą ósemkę szlakiem do schroniska. Po drodze zagadki na rozdrożach, deszcz, mgła i zgubiony termos.', win: 'Cała ósemka w schronisku, termos odnaleziony. Herbata jeszcze ciepła.' },
};
let LEVEL = 1, buildLv = 0;
/* What each lost wolf wants before he joins. */
const QUESTS = [
  { icon: '🧴', item: 'żel do włosów', ask: 'Bez żelu do włosów nigdzie nie idę. Znajdź mi go!' },
  { food: true, ask: 'Głodny nie idę. Najpierw kup prowiant u bacy na Krupówkach!' },
  { icon: '🪓', item: 'siekierę', ask: 'Zgubiłem siekierę. Bez niej się nie ruszam!' },
  { icon: '🗺️', item: 'mapę', ask: 'Oddaj mapę, to pokażę ci, jak się chodzi po górach.' },
  { sleep: true, ask: 'Chrrr… (śpi jak kamień, obudź go wyciem)' },
  { icon: '📖', item: 'tomik wierszy', ask: 'Zgubiłem tomik wierszy. Bez niego nie ma poezji!' },
  { icon: '🔨', item: 'młotek', ask: 'Gdzie mój młotek? Robota sama się nie zrobi!' },
  { run: 2, ask: 'Haha, najpierw mnie złap!', v: 'v14' },
];

const $ = id => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- renderer / scene ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
const scene = new THREE.Scene();
const SKY_DAY = new THREE.Color('#bfe0f0'), SKY_DUSK = new THREE.Color('#f2a96a'), SKY_NIGHT = new THREE.Color('#0b1228');
const ZEN_DAY = new THREE.Color('#4f9bd8'), ZEN_DUSK = new THREE.Color('#4d5596'), ZEN_NIGHT = new THREE.Color('#03050d');
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(SKY_DAY.clone(), 30, 105);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 1400);
const LV = { 1: new THREE.Group(), 2: new THREE.Group(), 3: new THREE.Group() }; for (const k in LV) { scene.add(LV[k]); LV[k].visible = k === '1'; }
const hemi = new THREE.HemisphereLight('#eaf6ff', '#4b6a3a', 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3d6', 1.6); sun.position.set(-40, 70, 30); scene.add(sun);

// sky dome with a soft gradient
const skyU = { uH: { value: new THREE.Color() }, uZ: { value: new THREE.Color() } };
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1100, 24, 12), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 uH; uniform vec3 uZ; varying vec3 vD; void main(){ float t = pow(clamp(vD.y, 0.0, 1.0), 0.55); gl_FragColor = vec4(mix(uH, uZ, t), 1.0); }',
}));
skyDome.renderOrder = -10; scene.add(skyDome);

const uP = { value: new THREE.Vector3(0, 0, 9999) }, uScr = { value: new THREE.Vector3(-9999, -9999, 0) };
/* Trees between the camera and the player become see-through. */
function seeThrough(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uP = uP; sh.uniforms.uScr = uScr;
